name: Maple

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "30 16 * * *"
    - cron: "50 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/maple.yml]

permissions:
  contents: write

concurrency: maple

jobs:
  maple:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: KorawitJung/maple-profile@v1
        with:
          timezone: Asia/Bangkok
